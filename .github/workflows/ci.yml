name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      # linux-abi-scan and linux-targets are git dependencies until published.
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --locked --offline
      - run: cargo clippy --all-targets --locked --offline -- -D warnings
  linux-link:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        clang: [21, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo fetch --locked
      - run: bash scripts/install-clang.sh "${{ matrix.clang }}"
      - run: bash scripts/smoke-linux.sh
        env:
          CARGO_LIBC_SMOKE_CC: /usr/bin/clang-${{ matrix.clang }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sysroot-clang-${{ matrix.clang }}-toolchain
          path: ${{ runner.temp }}/modern-toolchain.txt
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo fetch --locked
      - run: cargo check --all-targets --locked --offline

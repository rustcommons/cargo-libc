name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      # Download crates.io dependencies before the --offline steps.
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --locked --offline
      - run: cargo clippy --all-targets --locked --offline -- -D warnings
  linux-link:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        clang: [21, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo fetch --locked
      - run: bash scripts/install-clang.sh "${{ matrix.clang }}"
      - run: bash scripts/smoke-linux.sh
        env:
          CARGO_LIBC_SMOKE_CC: /usr/bin/clang-${{ matrix.clang }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sysroot-clang-${{ matrix.clang }}-toolchain
          path: ${{ runner.temp }}/modern-toolchain.txt
  providers:
    name: Automatic providers, every release (Clang ${{ matrix.clang }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        clang: [21]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo fetch --locked
      - run: bash scripts/install-clang.sh "${{ matrix.clang }}"
      - run: bash scripts/smoke-providers.sh /usr/bin/clang-${{ matrix.clang }}
  container-provider:
    name: Automatic provider in container mode (glibc 2.28)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo fetch --locked
      - run: bash scripts/install-clang.sh 21
      - run: sudo apt-get install -y podman curl
      - name: Build and inspect with a container-mode provider
        run: |
          set -euo pipefail
          export CARGO_LIBC_PROVIDER_DIR="$RUNNER_TEMP/providers"
          cargo build --locked --offline --target-dir "$RUNNER_TEMP/tools"
          export PATH="$RUNNER_TEMP/tools/debug:$PATH"
          artifact="$RUNNER_TEMP/app/x86_64-unknown-linux-gnu/debug/glibc-hello"
          CARGO_LIBC_PROVIDER_MODE=container cargo libc build --target x86_64-unknown-linux-gnu.2.28 \
            --cc /usr/bin/clang-21 --artifact "$artifact" -- \
            --manifest-path examples/hello/Cargo.toml --target-dir "$RUNNER_TEMP/app" --locked --offline \
            2>&1 | tee "$RUNNER_TEMP/build.log"
          grep -F 'glibc 2.28 provider (container mode, prepared)' "$RUNNER_TEMP/build.log"
          cargo libc inspect "$artifact" --max-glibc 2.28
          cargo libc provider verify --glibc 2.28 --mode container
          # The container provider has the real loader: run the program with it.
          dir=$(dirname "$(cargo libc provider path --glibc 2.28 --mode container)")
          "$dir/sysroot/lib64/ld-linux-x86-64.so.2" --library-path "$dir/run-runtime:$dir/sysroot/lib64" "$artifact" \
            | tee "$RUNNER_TEMP/run.log"
          grep -F 'target executable ran; thread result = 42' "$RUNNER_TEMP/run.log"
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo fetch --locked
      - run: cargo check --all-targets --locked --offline

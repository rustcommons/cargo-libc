name: Candidate integration
run-name: cargo-libc ${{ inputs.integration_mode }} integration ${{ inputs.candidate_ref }}
on:
  workflow_dispatch:
    inputs:
      integration_mode:
        description: Source candidate, registry-only release validation, or published installation
        type: choice
        options: [source, registry, installed, streams]
        default: source
      candidate_ref:
        description: Exact 40-character commit SHA in rustcommons/linux-abi-tools
        required: false
        type: string
permissions:
  contents: read
jobs:
  integration:
    if: inputs.integration_mode == 'source' || inputs.integration_mode == 'registry'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      CANDIDATE_REF: ${{ inputs.candidate_ref }}
      INTEGRATION_MODE: ${{ inputs.integration_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require an exact commit
        if: inputs.integration_mode == 'source'
        run: |
          [[ "$CANDIDATE_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
      - uses: actions/checkout@v4
        if: inputs.integration_mode == 'source'
        with:
          repository: rustcommons/linux-abi-tools
          ref: ${{ inputs.candidate_ref }}
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - name: Prepare disposable consumer and source overrides
        run: |
          set -euo pipefail
          if [ "$INTEGRATION_MODE" = source ]; then
            test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_REF"
            git -C candidate cat-file -e "$CANDIDATE_REF^{commit}"
          fi
          mkdir -p "$RUNNER_TEMP/consumer" "$RUNNER_TEMP/evidence"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/consumer"
          printf 'CONSUMER=%s/consumer\nEVIDENCE=%s/evidence\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          {
            printf 'consumer=%s\n' "$(git rev-parse HEAD)"
            printf 'mode=%s\n' "$INTEGRATION_MODE"
            if [ "$INTEGRATION_MODE" = source ]; then
              printf 'producer=%s\n' "$(git -C candidate rev-parse HEAD)"
            fi
            uname -m
            rustc --version
            cargo --version
          } | tee "$RUNNER_TEMP/evidence/commits.txt"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          if os.environ['INTEGRATION_MODE'] != 'source':
              raise SystemExit(0)
          producer = Path('candidate').resolve()
          paths = {'libc-abi-tools': producer}
          paths.update({name: producer / 'crates' / name for name in
                        ['kernel-abi-tools', 'linux-abi-scan', 'linux-targets']})
          manifest = Path(os.environ['RUNNER_TEMP']) / 'consumer/Cargo.toml'
          with manifest.open('a') as f:
              f.write('\n[patch.crates-io]\n')
              for name, path in paths.items():
                  f.write(f'{name} = {{ path = {json.dumps(str(path))} }}\n')
          PY
      - name: Resolve candidate and prove sources
        run: |
          set -euo pipefail
          cd "$CONSUMER"
          if [ "$INTEGRATION_MODE" = source ]; then
            cargo update -p libc-abi-tools -p kernel-abi-tools -p linux-abi-scan -p linux-targets
          fi
          cargo fetch --locked
          cargo metadata --format-version 1 --locked --offline > "$EVIDENCE/metadata.json"
          cp Cargo.toml Cargo.lock "$EVIDENCE/"
          python3 - <<'PY' | tee "$EVIDENCE/resolved-sources.txt"
          import json, os, tomllib
          from pathlib import Path
          producer = Path(os.environ['GITHUB_WORKSPACE']) / 'candidate'
          data = json.loads((Path(os.environ['EVIDENCE']) / 'metadata.json').read_text())
          source_mode = os.environ['INTEGRATION_MODE'] == 'source'
          manifest_data = tomllib.loads(Path('Cargo.toml').read_text())
          if not source_mode:
              assert not manifest_data.get('patch') and not manifest_data.get('replace')
              assert all(p['source'] == 'registry+https://github.com/rust-lang/crates.io-index'
                         for p in data['packages'] if p['name'] != 'cargo-libc')
              expected_versions = {'cargo-libc': '0.2.3',
                                   'libc-abi-tools': '0.3.3', 'kernel-abi-tools': '0.3.3',
                                   'linux-abi-scan': '0.3.3', 'linux-targets': '0.3.3',
                                   'glibc-abilists': '0.1.2', 'glibc-provider-sources': '0.1.1'}
              assert {p['name']: p['version'] for p in data['packages']} == expected_versions
              assert len(data['packages']) == len(expected_versions)
              lock = tomllib.loads(Path('Cargo.lock').read_text())
              assert {p['name']: p['version'] for p in lock['package']} == expected_versions
              assert manifest_data['dependencies'] == {
                  'kernel-abi-tools': '0.3.3', 'linux-abi-scan': '0.3.3',
                  'libc-abi-tools': '0.3.2', 'linux-targets': '0.3.0'}
          for name in ['libc-abi-tools', 'kernel-abi-tools', 'linux-abi-scan', 'linux-targets']:
              manifest = producer / ('Cargo.toml' if name == 'libc-abi-tools' else f'crates/{name}/Cargo.toml')
              expected = tomllib.loads(manifest.read_text())['package']['version'] if source_mode else '0.3.3'
              matches = [p for p in data['packages'] if p['name'] == name]
              assert len(matches) == 1, (name, matches)
              p = matches[0]
              if source_mode:
                  assert p['source'] is None and Path(p['manifest_path']).resolve() == manifest.resolve(), p
              assert p['version'] == expected, p
              print(f"{name} {p['version']} {p['source']} {p['manifest_path']}")
          PY
      - name: Portable consumer checks
        run: |
          set -euo pipefail
          cd "$CONSUMER"
          {
            cargo fmt --all -- --check
            cargo check --all-targets --locked --offline
            cargo test --all-targets --locked --offline
            cargo test --doc --locked --offline
            cargo clippy --all-targets --locked --offline -- -D warnings
            RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked --offline
          } 2>&1 | tee "$EVIDENCE/portable.log"
      - name: Shared provider stdout regression
        run: |
          set -euo pipefail
          cd "$CONSUMER"
          python3 scripts/check-provider-stdout.py target/debug/cargo-libc 2>&1 | tee "$EVIDENCE/provider-stdout.log"
      - name: Native tools and fixture dependencies
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 gcc g++ binutils cmake
          { /usr/bin/clang-18 --version; gcc --version; ld.bfd --version; cmake --version; getconf GNU_LIBC_VERSION; } > "$EVIDENCE/native-tools.txt"
          cd "$CONSUMER"
          cargo fetch --manifest-path examples/hello/Cargo.toml --locked
          cargo fetch --manifest-path examples/too-new/Cargo.toml --locked
          cargo fetch --manifest-path examples/c-deps/Cargo.toml --locked
      - name: Run and test redirected streams
        run: |
          set -euo pipefail
          cd "$CONSUMER"
          python3 scripts/check-run-streams.py target/debug /usr/bin/clang-18 2>&1 | tee "$EVIDENCE/run-streams.log"
      - name: Scanner and container IO boundaries
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends podman
          cd "$CONSUMER"
          bash scripts/install-crun.sh "$RUNNER_TEMP/crun"
          python3 scripts/check-malformed-scan.py target/debug/cargo-libc 2>&1 | tee "$EVIDENCE/malformed-scan.log"
          CHECK_STREAM_CONTAINERS="$RUNNER_TEMP/crun" python3 scripts/check-run-streams.py target/debug /usr/bin/clang-18 2>&1 | tee "$EVIDENCE/container-streams.log"
      - name: Automatic providers, reuse, inspect, run and symbol refusal
        run: |
          set -euo pipefail
          cd "$CONSUMER"
          bash scripts/smoke-providers.sh /usr/bin/clang-18 2.17 2.28 2>&1 | tee "$EVIDENCE/providers.log"
      - name: C dependencies and target C++ refusal
        run: |
          set -euo pipefail
          cd "$CONSUMER"
          bash scripts/smoke-c-deps.sh /usr/bin/clang-18 2.17 2.28 2>&1 | tee "$EVIDENCE/c-deps.log"
      - name: Cargo commands and both plain-Cargo configuration formats
        run: |
          set -euo pipefail
          cd "$CONSUMER"
          bash scripts/smoke-commands.sh /usr/bin/clang-18 2.17 2.28 2>&1 | tee "$EVIDENCE/commands.log"
      - name: Existing sysroot and host-target separation
        env:
          CARGO_LIBC_SMOKE_CC: /usr/bin/clang-18
        run: |
          set -euo pipefail
          cd "$CONSUMER"
          bash scripts/smoke-linux.sh 2>&1 | tee "$EVIDENCE/sysroot.log"
      - name: Registry package and clean unpacked installation
        if: inputs.integration_mode == 'registry'
        run: |
          set -euo pipefail
          cd "$CONSUMER"
          {
            cargo package --locked --offline
            version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
            package="target/package/cargo-libc-$version"
            cp "target/package/cargo-libc-$version.crate" "$EVIDENCE/"
            sha256sum "target/package/cargo-libc-$version.crate"
            python3 - <<'PYVERIFY'
          import hashlib, io, json, os, tarfile, tomllib, urllib.request
          from pathlib import Path
          url = 'https://static.crates.io/crates/cargo-libc/cargo-libc-0.2.2.crate'
          with urllib.request.urlopen(url, timeout=60) as response:
              baseline = response.read()
          assert hashlib.sha256(baseline).hexdigest() == '7ebc74cde32437217a0e8bcf0fec84c33436fb2ed33d066fac9651e4d0da7caf'
          def payload(archive):
              return {m.name.split('/', 1)[1]: archive.extractfile(m).read()
                      for m in archive.getmembers() if m.isfile()}
          with tarfile.open(fileobj=io.BytesIO(baseline)) as archive:
              old = payload(archive)
          with tarfile.open('target/package/cargo-libc-0.2.3.crate') as archive:
              new = payload(archive)
          assert set(old) - {'.cargo_vcs_info.json'} == set(new) - {'.cargo_vcs_info.json'}
          unchanged = sorted(name for name in old if name.startswith('src/') or name in ['LICENSE', 'NOTICE.md'])
          assert all(old[name] == new[name] for name in unchanged)
          old_manifest = tomllib.loads(old['Cargo.toml.orig'].decode())
          new_manifest = tomllib.loads(new['Cargo.toml.orig'].decode())
          assert old_manifest['package']['version'] == '0.2.2'
          assert new_manifest['package']['version'] == '0.2.3'
          old_manifest['package']['version'] = '0.2.3'
          assert old_manifest == new_manifest
          evidence = {'baseline': 'cargo-libc 0.2.2', 'candidate': 'cargo-libc 0.2.3',
                      'unchanged_payload_sha256': {name: hashlib.sha256(new[name]).hexdigest() for name in unchanged}}
          (Path(os.environ['EVIDENCE']) / 'package-payload-comparison.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print('All package paths and Rust/license/notice payload match official 0.2.2; only version/lock/README metadata differ.')
          PYVERIFY
            export CARGO_HOME="$RUNNER_TEMP/package-cargo-home"
            cargo fetch --manifest-path "$package/Cargo.toml" --locked
            cargo install --path "$package" --locked --offline --root "$RUNNER_TEMP/package-install"
            bash scripts/smoke-installed.sh "$RUNNER_TEMP/package-install" /usr/bin/clang-18 "$version"
            CHECK_STREAM_CONTAINERS="$RUNNER_TEMP/crun" python3 scripts/check-run-streams.py "$RUNNER_TEMP/package-install/bin" /usr/bin/clang-18
          } 2>&1 | tee "$EVIDENCE/package-install.log"
      - name: Verify production files are unchanged
        if: always()
        run: git diff --exit-code HEAD -- Cargo.toml Cargo.lock .github/workflows/ci.yml
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-integration-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error

  installed:
    if: inputs.integration_mode == 'installed'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Install published 0.2.3 into a clean root and exercise helpers
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 gcc g++ binutils cmake podman
          bash scripts/install-crun.sh "$RUNNER_TEMP/crun"
          mkdir -p "$RUNNER_TEMP/evidence"
          {
            git rev-parse HEAD
            export CARGO_HOME="$RUNNER_TEMP/published-cargo-home"
            cargo install cargo-libc --version 0.2.3 --locked --root "$RUNNER_TEMP/published-install"
            bash scripts/smoke-installed.sh "$RUNNER_TEMP/published-install" /usr/bin/clang-18 0.2.3
            CHECK_STREAM_CONTAINERS="$RUNNER_TEMP/crun" python3 scripts/check-run-streams.py "$RUNNER_TEMP/published-install/bin" /usr/bin/clang-18
          } 2>&1 | tee "$RUNNER_TEMP/evidence/published-install.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-install-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error

  streams:
    if: inputs.integration_mode == 'streams'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - name: Native prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 gcc binutils
      - name: Reproduce baseline stdout pollution
        run: |
          mkdir -p "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/evidence"
          git archive 92bc2b7874a5ee23975bd04e2ea29eb306b53f00 | tar -x -C "$RUNNER_TEMP/baseline"
          cargo build --manifest-path "$RUNNER_TEMP/baseline/Cargo.toml" --locked
          set -o pipefail
          python3 scripts/check-run-streams.py "$RUNNER_TEMP/baseline/target/debug" /usr/bin/clang-18 --expect-pollution | tee "$RUNNER_TEMP/evidence/baseline.log"
      - name: Final portable checks and package
        run: |
          cargo fmt --all -- --check
          cargo test --locked --offline
          cargo clippy --all-targets --locked --offline -- -D warnings
          cargo doc --no-deps --locked --offline
          cargo package --locked --offline
          cargo build --locked --offline
      - name: Verify native streams
        run: |
          set -o pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/evidence/consumer.txt"
          python3 scripts/check-run-streams.py target/debug /usr/bin/clang-18 2>&1 | tee "$RUNNER_TEMP/evidence/fixed.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-streams-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence

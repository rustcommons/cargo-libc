name: Candidate integration
run-name: cargo-libc ${{ inputs.integration_mode }} integration ${{ inputs.candidate_ref }}
on:
  workflow_dispatch:
    inputs:
      integration_mode:
        description: Source candidate, registry-only release validation, or published installation
        type: choice
        options: [source, registry, installed, streams, consumer-clock]
        default: source
      candidate_ref:
        description: Exact 40-character commit SHA in rustcommons/linux-abi-tools
        required: false
        type: string
permissions:
  contents: read
jobs:
  integration:
    if: inputs.integration_mode == 'source' || inputs.integration_mode == 'registry'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      CANDIDATE_REF: ${{ inputs.candidate_ref }}
      INTEGRATION_MODE: ${{ inputs.integration_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require an exact commit
        if: inputs.integration_mode == 'source'
        run: |
          [[ "$CANDIDATE_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [ "$CANDIDATE_REF" = 1b3b51c8afad88e05b0dc238c15f5ee879f94184 ]; then
            echo 'Producer ref is review-blocked; supply the corrected reviewed ref.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        if: inputs.integration_mode == 'source'
        with:
          repository: rustcommons/linux-abi-tools
          ref: ${{ inputs.candidate_ref }}
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - name: Prepare disposable consumer and source overrides
        run: |
          set -euo pipefail
          if [ "$INTEGRATION_MODE" = source ]; then
            test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_REF"
            git -C candidate cat-file -e "$CANDIDATE_REF^{commit}"
          fi
          mkdir -p "$RUNNER_TEMP/consumer" "$RUNNER_TEMP/evidence"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/consumer"
          printf 'CONSUMER=%s/consumer\nEVIDENCE=%s/evidence\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          {
            printf 'consumer=%s\n' "$(git rev-parse HEAD)"
            printf 'mode=%s\n' "$INTEGRATION_MODE"
            if [ "$INTEGRATION_MODE" = source ]; then
              printf 'producer=%s\n' "$(git -C candidate rev-parse HEAD)"
            fi
            uname -m
            rustc --version
            cargo --version
          } | tee "$RUNNER_TEMP/evidence/commits.txt"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          if os.environ['INTEGRATION_MODE'] != 'source':
              raise SystemExit(0)
          producer = Path('candidate').resolve()
          paths = {'libc-abi-tools': producer}

          manifest = Path(os.environ['RUNNER_TEMP']) / 'consumer/Cargo.toml'
          with manifest.open('a') as f:
              f.write('\n[patch.crates-io]\n')
              for name, path in paths.items():
                  f.write(f'{name} = {{ path = {json.dumps(str(path))} }}\n')
          PY
      - name: Resolve candidate and prove sources
        run: |
          set -euo pipefail
          cd "$CONSUMER"
          if [ "$INTEGRATION_MODE" = source ]; then
            cargo update -p libc-abi-tools
          fi
          cargo fetch --locked
          cargo metadata --format-version 1 --locked --offline > "$EVIDENCE/metadata.json"
          cp Cargo.toml Cargo.lock "$EVIDENCE/"
          python3 - <<'PY' | tee "$EVIDENCE/resolved-sources.txt"
          import json, os, tomllib
          from pathlib import Path
          producer = Path(os.environ['GITHUB_WORKSPACE']) / 'candidate'
          data = json.loads((Path(os.environ['EVIDENCE']) / 'metadata.json').read_text())
          source_mode = os.environ['INTEGRATION_MODE'] == 'source'
          manifest_data = tomllib.loads(Path('Cargo.toml').read_text())
          expected_versions = {'cargo-libc': '0.3.0',
                               'libc-abi-tools': '0.4.0', 'kernel-abi-tools': '0.3.3',
                               'linux-abi-scan': '0.3.3', 'linux-targets': '0.3.3',
                               'glibc-abilists': '0.1.2', 'glibc-provider-sources': '0.1.1'}
          assert {p['name']: p['version'] for p in data['packages']} == expected_versions
          lock = tomllib.loads(Path('Cargo.lock').read_text())
          assert {p['name']: p['version'] for p in lock['package']} == expected_versions
          expected_checksums = {
              'glibc-abilists': '0f76191d504fe7944029bf5ac1e3ee901b050e7ce3fc946fa2661a9094045287',
              'glibc-provider-sources': 'da10605d1cab20eb0ab8cf7ebe19b619737618578dc8c74e6c62a57e1a7ec440',
              'kernel-abi-tools': '0feddf7e5e33b15df1b279e3ba99c6a0743aae7edb91dd654e3a69ac01234dd3',
              'linux-abi-scan': 'eedffc57c88f27dee9bd28c3f177f39a457a694ddbe2678d9ba9e6078702028e',
              'linux-targets': '9138ccb80a4467c37c805b9ed7bfab8a574bd749a52fe42c4e00921e24affcb1',
          }
          assert {p['name']: p['checksum'] for p in lock['package'] if p['name'] in expected_checksums} == expected_checksums
          assert manifest_data['dependencies'] == {
              'kernel-abi-tools': '0.3.3', 'linux-abi-scan': '0.3.3',
              'libc-abi-tools': '0.4.0', 'linux-targets': '0.3.0'}
          assert not manifest_data.get('replace')
          if source_mode:
              assert set(manifest_data['patch']['crates-io']) == {'libc-abi-tools'}
          else:
              assert not manifest_data.get('patch')
          for p in data['packages']:
              if p['name'] == 'cargo-libc':
                  continue
              if source_mode and p['name'] == 'libc-abi-tools':
                  assert p['source'] is None and Path(p['manifest_path']).resolve() == (producer / 'Cargo.toml').resolve(), p
              else:
                  assert p['source'] == 'registry+https://github.com/rust-lang/crates.io-index', p
              print(f"{p['name']} {p['version']} {p['source']} {p['manifest_path']}")
          PY
      - name: Portable consumer checks
        if: inputs.integration_mode == 'registry'
        run: |
          set -euo pipefail
          cd "$CONSUMER"
          {
            cargo fmt --all -- --check
            cargo check --all-targets --locked --offline
            cargo test --all-targets --locked --offline
            cargo test --doc --locked --offline
            cargo clippy --all-targets --locked --offline -- -D warnings
            RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked --offline
          } 2>&1 | tee "$EVIDENCE/portable.log"
      - name: Scoped source consumer checks (not the final release suite)
        if: inputs.integration_mode == 'source'
        run: |
          set -euo pipefail
          cd "$CONSUMER"
          cargo fmt --all -- --check
          cargo test --lib clock:: --locked --offline
          cargo test --lib elf:: --locked --offline
          cargo clippy --all-targets --locked --offline -- -D warnings
          cargo build --locked --offline
      - name: Shared provider stdout regression
        if: inputs.integration_mode == 'registry'
        run: |
          set -euo pipefail
          cd "$CONSUMER"
          python3 scripts/check-provider-stdout.py target/debug/cargo-libc 2>&1 | tee "$EVIDENCE/provider-stdout.log"
      - name: Native tools and fixture dependencies
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 gcc g++ binutils cmake
          { /usr/bin/clang-18 --version; gcc --version; ld.bfd --version; cmake --version; getconf GNU_LIBC_VERSION; } > "$EVIDENCE/native-tools.txt"
          cd "$CONSUMER"
          cargo fetch --manifest-path examples/hello/Cargo.toml --locked
          cargo fetch --manifest-path examples/too-new/Cargo.toml --locked
          cargo fetch --manifest-path examples/c-deps/Cargo.toml --locked
      - name: Clock family native ELF and same-directory upgrade
        if: inputs.integration_mode == 'source'
        run: |
          set -euo pipefail
          cargo install cargo-libc --version 0.2.4 --locked --root "$RUNNER_TEMP/clock-old"
          cd "$CONSUMER"
          python3 scripts/check-clock-profile.py target/debug "$RUNNER_TEMP/clock-old/bin" "$EVIDENCE/clocks" 2>&1 | tee "$EVIDENCE/clocks.log"
      - name: Run and test redirected streams
        if: inputs.integration_mode == 'registry'
        run: |
          set -euo pipefail
          cd "$CONSUMER"
          python3 scripts/check-run-streams.py target/debug /usr/bin/clang-18 2>&1 | tee "$EVIDENCE/run-streams.log"
      - name: Scanner and container IO boundaries
        if: inputs.integration_mode == 'registry'
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends podman
          cd "$CONSUMER"
          bash scripts/install-crun.sh "$RUNNER_TEMP/crun"
          python3 scripts/check-malformed-scan.py target/debug/cargo-libc 2>&1 | tee "$EVIDENCE/malformed-scan.log"
          CHECK_STREAM_CONTAINERS="$RUNNER_TEMP/crun" python3 scripts/check-run-streams.py target/debug /usr/bin/clang-18 2>&1 | tee "$EVIDENCE/container-streams.log"
      - name: Automatic providers, reuse, inspect, run and symbol refusal
        if: inputs.integration_mode == 'registry'
        run: |
          set -euo pipefail
          cd "$CONSUMER"
          bash scripts/smoke-providers.sh /usr/bin/clang-18 2.17 2.28 2>&1 | tee "$EVIDENCE/providers.log"
      - name: C dependencies and target C++ refusal
        run: |
          set -euo pipefail
          cd "$CONSUMER"
          releases="2.17 2.28"
          if [ "$INTEGRATION_MODE" = source ]; then releases=2.22; fi
          bash scripts/smoke-c-deps.sh /usr/bin/clang-18 $releases 2>&1 | tee "$EVIDENCE/c-deps.log"
      - name: Cargo commands and both plain-Cargo configuration formats
        run: |
          set -euo pipefail
          cd "$CONSUMER"
          releases="2.17 2.28"
          if [ "$INTEGRATION_MODE" = source ]; then releases=2.22; fi
          bash scripts/smoke-commands.sh /usr/bin/clang-18 $releases 2>&1 | tee "$EVIDENCE/commands.log"
      - name: Existing sysroot and host-target separation
        env:
          CARGO_LIBC_SMOKE_CC: /usr/bin/clang-18
        run: |
          set -euo pipefail
          cd "$CONSUMER"
          bash scripts/smoke-linux.sh 2>&1 | tee "$EVIDENCE/sysroot.log"
      - name: Registry package and clean unpacked installation
        if: inputs.integration_mode == 'registry'
        run: |
          set -euo pipefail
          cd "$CONSUMER"
          {
            cargo package --locked --offline
            version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
            package="target/package/cargo-libc-$version"
            cp "target/package/cargo-libc-$version.crate" "$EVIDENCE/"
            sha256sum "target/package/cargo-libc-$version.crate"
            python3 - <<'PYVERIFY'
          import hashlib, io, json, os, tarfile, tomllib, urllib.request
          from pathlib import Path
          url = 'https://static.crates.io/crates/cargo-libc/cargo-libc-0.2.3.crate'
          with urllib.request.urlopen(url, timeout=60) as response:
              baseline = response.read()
          assert hashlib.sha256(baseline).hexdigest() == 'cec36f14679064031545748420e97b3fbadea811be7b504177f6b25c1dfd585a'
          def payload(archive):
              return {m.name.split('/', 1)[1]: archive.extractfile(m).read()
                      for m in archive.getmembers() if m.isfile()}
          with tarfile.open(fileobj=io.BytesIO(baseline)) as archive:
              old = payload(archive)
          with tarfile.open('target/package/cargo-libc-0.2.4.crate') as archive:
              new = payload(archive)
          assert set(old) - {'.cargo_vcs_info.json'} == set(new) - {'.cargo_vcs_info.json'}
          unchanged = sorted(name for name in old if name.startswith('src/') or name in ['LICENSE', 'NOTICE.md'])
          assert all(old[name] == new[name] for name in unchanged)
          old_manifest = tomllib.loads(old['Cargo.toml.orig'].decode())
          new_manifest = tomllib.loads(new['Cargo.toml.orig'].decode())
          assert old_manifest['package']['version'] == '0.2.3'
          assert new_manifest['package']['version'] == '0.2.4'
          old_manifest['package']['version'] = '0.2.4'
          assert old_manifest == new_manifest
          old_lock = tomllib.loads(old['Cargo.lock'].decode())
          new_lock = tomllib.loads(new['Cargo.lock'].decode())
          own = next(p for p in old_lock['package'] if p['name'] == 'cargo-libc')
          assert own['version'] == '0.2.3'
          own['version'] = '0.2.4'
          assert old_lock == new_lock
          readme = new['README.md'].decode()
          assert '[Release policy and records](https://github.com/rustcommons/cargo-libc/blob/main/docs/RELEASING.md)' in readme
          assert 'Current release:' not in readme
          evidence = {'baseline': 'cargo-libc 0.2.3', 'candidate': 'cargo-libc 0.2.4',
                      'unchanged_payload_sha256': {name: hashlib.sha256(new[name]).hexdigest() for name in unchanged}}
          (Path(os.environ['EVIDENCE']) / 'package-payload-comparison.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print('All package paths and Rust/license/notice payload match official 0.2.3; only version/lock/README metadata differ.')
          PYVERIFY
            export CARGO_HOME="$RUNNER_TEMP/package-cargo-home"
            cargo fetch --manifest-path "$package/Cargo.toml" --locked
            cargo install --path "$package" --locked --offline --root "$RUNNER_TEMP/package-install"
            bash scripts/smoke-installed.sh "$RUNNER_TEMP/package-install" /usr/bin/clang-18 "$version"
            CHECK_STREAM_CONTAINERS="$RUNNER_TEMP/crun" python3 scripts/check-run-streams.py "$RUNNER_TEMP/package-install/bin" /usr/bin/clang-18
          } 2>&1 | tee "$EVIDENCE/package-install.log"
      - name: Verify production files are unchanged
        if: always()
        run: git diff --exit-code HEAD -- Cargo.toml Cargo.lock .github/workflows/ci.yml
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-integration-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error

  installed:
    if: inputs.integration_mode == 'installed'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Install published 0.2.4 into a clean root and exercise helpers
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 gcc g++ binutils cmake podman
          bash scripts/install-crun.sh "$RUNNER_TEMP/crun"
          mkdir -p "$RUNNER_TEMP/evidence"
          {
            git rev-parse HEAD
            export CARGO_HOME="$RUNNER_TEMP/published-cargo-home"
            cargo install cargo-libc --version 0.2.4 --locked --root "$RUNNER_TEMP/published-install"
            bash scripts/smoke-installed.sh "$RUNNER_TEMP/published-install" /usr/bin/clang-18 0.2.4
            CHECK_STREAM_CONTAINERS="$RUNNER_TEMP/crun" python3 scripts/check-run-streams.py "$RUNNER_TEMP/published-install/bin" /usr/bin/clang-18
          } 2>&1 | tee "$RUNNER_TEMP/evidence/published-install.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-install-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error

  streams:
    if: inputs.integration_mode == 'streams'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - name: Native prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 gcc binutils
      - name: Reproduce baseline stdout pollution
        run: |
          mkdir -p "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/evidence"
          git archive 92bc2b7874a5ee23975bd04e2ea29eb306b53f00 | tar -x -C "$RUNNER_TEMP/baseline"
          cargo build --manifest-path "$RUNNER_TEMP/baseline/Cargo.toml" --locked
          set -o pipefail
          python3 scripts/check-run-streams.py "$RUNNER_TEMP/baseline/target/debug" /usr/bin/clang-18 --expect-pollution | tee "$RUNNER_TEMP/evidence/baseline.log"
      - name: Final portable checks and package
        run: |
          cargo fmt --all -- --check
          cargo test --locked --offline
          cargo clippy --all-targets --locked --offline -- -D warnings
          cargo doc --no-deps --locked --offline
          cargo package --locked --offline
          cargo build --locked --offline
      - name: Verify native streams
        run: |
          set -o pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/evidence/consumer.txt"
          python3 scripts/check-run-streams.py target/debug /usr/bin/clang-18 2>&1 | tee "$RUNNER_TEMP/evidence/fixed.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-streams-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence

  consumer_clock_capture:
    if: inputs.integration_mode == 'consumer-clock'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      CARGO_HOME: ${{ github.workspace }}/clock-cargo-home
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: clock-tool
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: joey-huckabee/aero1553
          ref: 9c248300f1e2ab20ce34dc4b227eb322e33e4c93
          path: consumer
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Prepare exact tools and record public source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(git -C clock-tool rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C consumer rev-parse HEAD)" = 9c248300f1e2ab20ce34dc4b227eb322e33e4c93
          python3 - <<'PYVERIFY'
          import tomllib
          from pathlib import Path
          assert tomllib.loads(Path('clock-tool/Cargo.toml').read_text())['package']['version'] == '0.3.0'
          PYVERIFY
          mkdir -p "$RUNNER_TEMP/clock-evidence"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 gcc binutils
          python3 -m pip install --user ziglang==0.17.0
          cargo install --locked cargo-libc --version 0.2.4 --root "$RUNNER_TEMP/clock-old"
          CARGO_TARGET_DIR="$RUNNER_TEMP/clock-tool-target" cargo install --path clock-tool --locked --root "$RUNNER_TEMP/clock-new"
          cargo install --locked cargo-zigbuild --version 0.23.4 --root "$RUNNER_TEMP/clock-zigbuild"
          {
            git -C clock-tool rev-parse HEAD
            git -C consumer rev-parse HEAD
            uname -a
            echo "ImageOS=${ImageOS-} ImageVersion=${ImageVersion-}"
            rustc -vV
            cargo -V
            /usr/bin/clang-18 --version
            gcc --version
            ld --version
            python3 -m ziglang version
            "$RUNNER_TEMP/clock-old/bin/cargo-libc" --version
            "$RUNNER_TEMP/clock-new/bin/cargo-libc" --version
            "$RUNNER_TEMP/clock-zigbuild/bin/cargo-zigbuild" --version
          } > "$RUNNER_TEMP/clock-evidence/versions.txt"
          cp clock-tool/Cargo.toml "$RUNNER_TEMP/clock-evidence/tool-Cargo.toml"
          cp clock-tool/Cargo.lock "$RUNNER_TEMP/clock-evidence/tool-Cargo.lock"
          cp consumer/rust/Cargo.lock "$RUNNER_TEMP/clock-evidence/consumer-Cargo.lock"
      - name: Build same consumer with old and candidate tools
        working-directory: consumer/rust
        shell: bash
        env:
          RUSTC_LOG: rustc_codegen_ssa::back::link=info
        run: |
          set -euo pipefail
          for variant in old new; do
            export PATH="$RUNNER_TEMP/clock-$variant/bin:$PATH"
            export CARGO_TARGET_DIR="$RUNNER_TEMP/clock-target-$variant"
            export CARGO_LIBC_PROVIDER_LINK_MAP="$RUNNER_TEMP/clock-evidence/$variant.map"
            cargo libc build --distro sles-12-sp5 --cc /usr/bin/clang-18 --artifact "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/aero1553" -- --release --locked -vv 2>&1 | tee "$RUNNER_TEMP/clock-evidence/$variant-build.log"
            cp "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/aero1553" "$RUNNER_TEMP/clock-evidence/$variant"
          done
      - name: Build exact Zig comparison
        working-directory: consumer/rust
        shell: bash
        env:
          RUSTC_LOG: rustc_codegen_ssa::back::link=info
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/clock-zigbuild/bin:$PATH"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/clock-target-zig"
          cargo zigbuild --locked --release --target x86_64-unknown-linux-gnu.2.22 -vv 2>&1 | tee "$RUNNER_TEMP/clock-evidence/zig-build.log"
          cp "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/aero1553" "$RUNNER_TEMP/clock-evidence/zig"
      - name: Save ELF evidence and unchanged strict comparisons
        working-directory: consumer
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/clock-evidence"
          for variant in old new zig; do
            readelf -W -h -l -d -V --dyn-syms "$evidence/$variant" > "$evidence/$variant.readelf.txt"
            objdump -T "$evidence/$variant" > "$evidence/$variant.objdump.txt"
            sha256sum "$evidence/$variant" >> "$evidence/binaries.sha256"
          done
          for variant in old new; do
            set +e
            timeout 8m python3 scripts/compare-binaries.py "$evidence/zig" "$evidence/$variant" --rounds 1 > "$evidence/$variant-comparison.stdout" 2> "$evidence/$variant-comparison.stderr"
            result=$?
            set -e
            printf '%s' "$result" > "$evidence/$variant-comparison.exit"
          done
          git diff --exit-code HEAD
      - name: Assess only the allowed clock-policy delta, separately
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYASSESS'
          import json
          import os
          from pathlib import Path

          e = Path(os.environ['RUNNER_TEMP']) / 'clock-evidence'
          clocks = {'clock_getcpuclockid', 'clock_getres', 'clock_gettime', 'clock_nanosleep', 'clock_settime'}


          def requirements(name):
              lines = (e / f'{name}.readelf.txt').read_text().splitlines()
              interpreter, needed = [], []
              for line in lines:
                  marker = 'Requesting program interpreter:'
                  if marker in line:
                      value = line.partition(marker)[2].strip()
                      if not value.endswith(']'):
                          raise ValueError(f'{name}: malformed interpreter')
                      interpreter.append(value[:-1])
                  if '(NEEDED)' in line:
                      value = line.partition('Shared library:')[2].strip()
                      if not value.startswith('[') or not value.endswith(']'):
                          raise ValueError(f'{name}: malformed NEEDED')
                      needed.append(value[1:-1])
              if len(interpreter) != 1 or not interpreter[0] or not needed or any(not n for n in needed):
                  raise ValueError(f'{name}: missing interpreter or NEEDED evidence')

              # Join undefined dynsym version indexes to .gnu.version_r File entries.
              # Version text alone is insufficient: multiple DSOs can own GLIBC_2.2.5.
              version_needs = {}
              inside_needs, library = False, None
              for line in lines:
                  fields = line.split()
                  if line.strip().startswith('Version ') and 'section ' in line:
                      inside_needs = line.strip().startswith('Version needs section ')
                      library = None
                  if not inside_needs:
                      continue
                  if 'File:' in fields:
                      library = fields[fields.index('File:') + 1]
                  if 'Name:' in fields and 'Version:' in fields:
                      version = fields[fields.index('Name:') + 1]
                      index = int(fields[fields.index('Version:') + 1])
                      if library not in needed or index in version_needs:
                          raise ValueError(f'{name}: invalid or duplicate version-need ownership')
                      version_needs[index] = (version, library)

              owned_imports = set()
              for line in lines:
                  fields = line.split()
                  if not fields or not fields[0].endswith(':') or not fields[0][:-1].isdigit() or 'UND' not in fields:
                      continue
                  at = fields.index('UND') + 1
                  if at == len(fields):  # dynsym index 0 has an empty name
                      continue
                  symbol = fields[at]
                  if '@' in symbol:
                      symbol, _, version = symbol.partition('@')
                      version = version.lstrip('@')
                      if at + 1 >= len(fields):
                          raise ValueError(f'{name}: missing dynsym version index')
                      token = fields[at + 1]
                      if not token.startswith('(') or not token.endswith(')') or not token[1:-1].isdigit():
                          raise ValueError(f'{name}: malformed dynsym version index')
                      index = int(token[1:-1])
                      owner = version_needs.get(index)
                      if owner is None or owner[0] != version:
                          raise ValueError(f'{name}: unresolved/mismatched version-need index for {symbol}')
                      owned_imports.add((symbol, version, owner[1]))
                  else:
                      owned_imports.add((symbol, '(none)', None))

              imports = set()
              for line in (e / f'{name}.objdump.txt').read_text().splitlines():
                  if '*UND*' in line:
                      fields = line.split()
                      version = fields[-2] if fields[-2].startswith('(') else '(none)'
                      imports.add((version, fields[-1]))
              from_readelf = {
                  (f'({version})' if version != '(none)' else '(none)', symbol)
                  for symbol, version, library in owned_imports
              }
              if not imports or imports != from_readelf:
                  raise ValueError(f'{name}: objdump/readelf undefined import evidence disagrees')
              return {
                  'interpreter': interpreter,
                  'needed_in_order': needed,
                  'imports': sorted(imports),
                  'imports_with_owners': [
                      {'name': symbol, 'version': version, 'library': library}
                      for symbol, version, library in sorted(owned_imports)
                  ],
              }


          data = {n: requirements(n) for n in ['old', 'new', 'zig']}
          errors = []
          for variant in ['old', 'new']:
              code = int((e / f'{variant}-comparison.exit').read_text())
              text = (e / f'{variant}-comparison.stdout').read_text()
              if code not in (0, 1) or 'same behaviour: 182 of 182 invocations' not in text:
                  errors.append(f'{variant}: comparator error/timeout or behavior mismatch')
          old, new = data['old'], data['new']
          if old['interpreter'] != new['interpreter']:
              errors.append('candidate changed interpreter')
          nonclock = lambda r: {tuple(x) for x in r['imports'] if x[1] not in clocks}
          if nonclock(old) != nonclock(new):
              errors.append('candidate changed non-clock imports, including unwinder/weak imports')
          nonclock_owners = lambda r: {
              (x['name'], x['version'], x['library'])
              for x in r['imports_with_owners'] if x['name'] not in clocks
          }
          if nonclock_owners(old) != nonclock_owners(new):
              errors.append('candidate changed non-clock version-needed ownership')
          old_needed, new_needed = set(old['needed_in_order']), set(new['needed_in_order'])
          if new_needed - old_needed or old_needed - new_needed - {'librt.so.1'}:
              errors.append('candidate dependency changes exceed optional librt removal')
          needed_order_equal = (
              [x for x in old['needed_in_order'] if x != 'librt.so.1']
              == [x for x in new['needed_in_order'] if x != 'librt.so.1']
          )
          old_clock = {x['name'] for x in old['imports_with_owners'] if x['name'] in clocks}
          new_clock = {x['name']: x for x in new['imports_with_owners'] if x['name'] in clocks}
          if old_clock != set(new_clock) or 'clock_gettime' not in new_clock:
              errors.append('unexpected clock import set')
          if any(x['version'] != 'GLIBC_2.17' or x['library'] != 'libc.so.6' for x in new_clock.values()):
              errors.append('candidate clock default is not GLIBC_2.17 owned by libc.so.6')
          report = {
              'source_commit': os.environ['GITHUB_SHA'],
              'requirements': data,
              'allowed_delta': 'old-to-candidate: clock versions to libc GLIBC_2.17; optional librt removal only; no unwinder change',
              'strict_consumer_comparator_unmodified': True,
              'strict_zig_identity_not_claimed': True,
              'non_librt_dependency_order_equal': needed_order_equal,
              'dependency_order_review': 'Record order changes for review; sorted comparator cannot prove load-order equivalence',
              'coverage': '182 cases per variant against Zig; no actual SLES host qualification',
              'errors': errors,
          }
          (e / 'separate-clock-assessment.json').write_text(json.dumps(report, indent=2))
          if errors:
              raise SystemExit('; '.join(errors))
          PYASSESS
          git -C clock-tool diff --exit-code HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aero1553-three-way-clock-${{ github.run_id }}
          path: ${{ runner.temp }}/clock-evidence
          if-no-files-found: error

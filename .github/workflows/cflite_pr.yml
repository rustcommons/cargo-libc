name: ClusterFuzzLite PR fuzzing
on:
  pull_request:
    paths:
      - 'src/**'
      - 'fuzz/**'
      - '.clusterfuzzlite/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/cflite_pr.yml'
# Only newer runs of the same PR supersede each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  code-change:
    # Dependabot PRs run the core checks only.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Reads the latest batch corpus from workflow artifacts.
      actions: read
      # Uploads crash SARIF to code scanning.
      security-events: write
    steps:
      - name: Build fuzzers (address)
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: Fuzz code changes for 300 s
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: address
          output-sarif: true
      - name: Upload crash SARIF
        if: always() && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: cifuzz-sarif/results.sarif
          checkout_path: cifuzz-sarif
          category: clusterfuzzlite

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    # Routine updates wait seven days; security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Routine updates wait seven days; security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    # These commits encode different Rust versions. Updating them as one action
    # can collapse MSRV/current coverage; review pins and security fixes manually.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    groups:
      minor-and-patch:
        update-types: [minor, patch]

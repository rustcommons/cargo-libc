[package]
name = "cargo-libc"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Cargo subcommand: build Rust for an older glibc (2.17 through 2.44 on x86-64 Linux) and check what binaries require"
repository = "https://github.com/rustcommons/cargo-libc"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/cargo-libc"
keywords = ["glibc", "cargo", "linux", "elf", "compatibility"]
categories = ["development-tools::cargo-plugins", "development-tools::build-utils"]
# The crate is the tool's source: no examples, scripts, CI or docs (README links
# resolve against the repository).
include = ["/src/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/NOTICE.md"]

[lib]
name = "cargo_libc"
path = "src/lib.rs"

[[bin]]
name = "cargo-libc"
path = "src/main.rs"

[[bin]]
name = "libc-linker"
path = "src/bin/libc-linker.rs"

[[bin]]
name = "libc-cc"
path = "src/bin/libc-cc.rs"

[[bin]]
name = "libc-cxx"
path = "src/bin/libc-cxx.rs"

[[bin]]
name = "libc-runner"
path = "src/bin/libc-runner.rs"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[profile.release]
strip = true

[dependencies]
# First-party rustcommons crates for tier 1 binary scans (`inspect --distro`/`--kernel`).
kernel-abi-tools = "0.3.0"
linux-abi-scan = "0.3.0"
linux-targets = "0.3.0"
# Provider preparation (`cargo libc provider`, automatic providers). Its default
# features compile in glibc's ABI lists (glibc-abilists) and recorded sources
# (glibc-provider-sources), LGPL-2.1-or-later.
libc-abi-tools = "0.3.0"

[package]
name = "cargo-libc"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Build for a selected libc environment and inspect ELF requirements; glibc first"
repository = "https://github.com/rustcommons/cargo-libc"
license = "MIT"
publish = false

[lib]
name = "cargo_libc"
path = "src/lib.rs"

[[bin]]
name = "cargo-libc"
path = "src/main.rs"

[[bin]]
name = "libc-linker"
path = "src/bin/libc-linker.rs"

[[bin]]
name = "libc-runner"
path = "src/bin/libc-runner.rs"

[profile.release]
strip = true

[dependencies]
# First-party rustcommons crates for tier 1 binary scans (`inspect --distro`/`--kernel`).
kernel-abi-tools = "0.1.0"
linux-abi-scan = "0.1.0"
linux-targets = "0.1.0"
# Provider preparation (`cargo libc provider`, automatic providers). Its default
# features compile in glibc's ABI lists (glibc-abilists) and recorded sources
# (glibc-provider-sources), LGPL-2.1-or-later. A git revision until the provider
# module is published; publishing uses the version.
libc-abi-tools = { version = "0.2.0", git = "https://github.com/rustcommons/linux-abi-tools", rev = "47785ebf9ae6d845800851482bd735237aea1d96" }

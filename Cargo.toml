[package]
name = "cargo-libc"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Build for a selected libc environment and inspect ELF requirements; glibc first"
repository = "https://github.com/rustcommons/cargo-libc"
license = "MIT"
publish = false

[lib]
name = "cargo_libc"
path = "src/lib.rs"

[[bin]]
name = "cargo-libc"
path = "src/main.rs"

[[bin]]
name = "libc-linker"
path = "src/bin/libc-linker.rs"

[profile.release]
strip = true

[dependencies]
# First-party rustcommons crates for tier 1 binary scans (`inspect --distro`/`--kernel`).
# Pinned to a full commit until they are published on crates.io.
linux-abi-scan = { git = "https://github.com/rustcommons/linux-abi-tools", rev = "e75b610de93a921d68fee9df613e896aa7151380" }
linux-targets = { git = "https://github.com/rustcommons/linux-abi-tools", rev = "e75b610de93a921d68fee9df613e896aa7151380" }

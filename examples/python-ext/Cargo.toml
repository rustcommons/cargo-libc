[package]
name = "glibc-python-ext"
version = "0.1.0"
edition = "2021"
publish = false

# A Python extension module: a shared library that Python loads.
[lib]
name = "glibc_python_ext"
crate-type = ["cdylib"]

[dependencies]
# One abi3 wheel serves every CPython from 3.10. maturin turns on
# `extension-module` ([tool.maturin] features), so libpython is not linked.
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }

[workspace]

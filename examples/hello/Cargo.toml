[package]
name = "glibc-hello"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
hello-macro = { path = "hello-macro" }

[features]
qualification = []

[[example]]
name = "qualification"
path = "examples/qualification.rs"
required-features = ["qualification"]

[workspace]
members = ["workspace-member"]

[profile.qualification]
inherits = "release"
opt-level = 1

